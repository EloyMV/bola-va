name: Publish Bola Va

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - lib/**
      - assets/**
      - web/**
      - pubspec.yaml
      - pubspec.lock
      - tool/package_pwa.mjs
      - publicacion/public/**
      - publicacion/scripts/build.mjs
      - .github/workflows/deploy-bola-va.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Compile current Flutter source
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build web --release --base-href /bola-va/app/ --no-web-resources-cdn --no-wasm-dry-run
      - name: Package installable web app
        env:
          BOLA_PWA_SCOPE: /bola-va/app/
        run: node tool/package_pwa.mjs
      - name: Build static site
        run: node publicacion/scripts/build.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publicacion/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
