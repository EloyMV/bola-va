name: Publish Bola Va

on:
  push:
    branches:
      - main
    paths:
      - publicacion/public/**
      - publicacion/scripts/build.mjs
      - .github/workflows/deploy-bola-va.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication files
        uses: actions/checkout@v4
      - name: Build static site
        run: node publicacion/scripts/build.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publicacion/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          error_count: 30