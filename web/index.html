<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Bola Va: reservas de pistas de pádel.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bola Va">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#142E28">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bola Va</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #F4F3EE; }
    #startup { position: fixed; inset: 0; display: grid; place-content: center; gap: 16px; padding: 24px; color: #142E28; text-align: center; font: 16px sans-serif; }
    #startup img { width: 72px; height: 72px; margin: 0 auto; }
    #startup-retry { justify-self: center; padding: 10px 18px; border: 0; background: #142E28; color: white; font: inherit; }
    #startup-error[hidden], #startup-retry[hidden] { display: none; }
  </style>
</head>
<body>
  <main id="startup" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="Bola Va">
    <div id="startup-status">Preparando Bola Va…</div>
    <div id="startup-error" hidden>No se pudo iniciar la aplicación. Comprueba la conexión e inténtalo de nuevo.</div>
    <button id="startup-retry" type="button" hidden>Reintentar</button>
  </main>
  <script src="pwa.js" defer></script>
  <script src="flutter_bootstrap.js" async onerror="document.getElementById('startup-error').hidden = false; document.getElementById('startup-retry').hidden = false;"></script>
</body>
</html>
